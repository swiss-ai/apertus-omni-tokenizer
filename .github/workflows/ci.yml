name: CI

on:
  pull_request:
    paths:
      - "chat_templates/**"
  push:
    branches: [main]
    paths:
      - "chat_templates/**"

jobs:
  lint-jinja:
    name: Jinja syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run chat template tests
        run: pytest tests/test_chat_template.py -v