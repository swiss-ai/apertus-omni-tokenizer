name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit (whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  chat-template-tests:
    name: Chat template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run chat template tests
        run: pytest tests/test_chat_template.py -v

  offline-unit-tests:
    name: Offline unit tests (builder, alias, instruct)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run offline unit tests
        run: >
          pytest -v
          tests/test_alias.py::TestAliasNormalizerChain
          tests/test_builder.py::TestOmnimodalDerivation
          tests/test_builder.py::TestShipped1p5
          tests/test_builder.py::TestAddModalityOffline
          tests/test_builder.py::TestInPlaceOffline
          tests/test_instruct.py

  tokenizer-tests:
    name: Tokenizer load + round-trip tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run tokenizer tests
        run: pytest tests/test_tokenizers.py -v

  checksum-manifests:
    name: Checksum manifests up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate checksum manifests
        run: bash validation/gen_checksums.sh

      - name: Fail if manifests drifted from checked-in tokenizers
        run: git diff --exit-code validation/