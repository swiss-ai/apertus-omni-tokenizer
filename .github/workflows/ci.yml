name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit (whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  chat-template-tests:
    name: Chat template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Run chat template tests
        run: pytest tests/test_chat_template.py -v