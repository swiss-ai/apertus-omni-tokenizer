[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitok"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # tokenizers 0.22.2 loads the 135k added tokens of Apertus 1.5 in seconds
    # (minutes before); transformers 4.56 is the first release that accepts it.
    # 4.57.2 fails on directories holding a model config.json (Hub snapshots);
    # 4.57.3 queries the Hub on every load by repo id and fails offline.
    # No upper bounds: CI tests the newest releases (see README).
    "transformers>=4.56,!=4.57.2,!=4.57.3",
    "tokenizers>=0.22.2",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jinja2",
]

[tool.setuptools.packages.find]
include = ["omnitok*"]